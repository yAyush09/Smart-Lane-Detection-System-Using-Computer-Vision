<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Detection Application</title>
    <style>
        /* Setting the background image for the body */
        body {
            background-image: url('"C:\Users\HP\Downloads\car.jpeg"');  /* Replace with your image path */
            background-size: cover;  /* Ensures the image covers the entire page */
            background-position: center center;  /* Centers the image */
            background-repeat: no-repeat;  /* Prevents the image from repeating */
            height: 100vh;  /* Full height */
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Title Section */
        .title {
            background-color: rgba(31, 31, 46, 0.7);  /* Semi-transparent background */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 40px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Subtitle Section */
        .subtitle {
            background-color: rgba(31, 31, 46, 0.7);  /* Semi-transparent background */
            color: #00ff00;
            padding: 15px;
            font-size: 25px;
            text-align: center;
            margin-top: 10px;
            border-radius: 10px;
        }

        /* Container for content */
        .content {
            text-align: center;
            margin-top: 50px;
        }

        /* Button style */
        .btn {
            background-color: #00ff01;  /* Green color for button */
            padding: 10px 20px;
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #00cc00;
        }
    </style>
</head>
<body>

    <!-- Main Title Section -->
    <div class="title">
        Lane Detection Application
    </div>

    <!-- Subtitle Section -->
    <div class="subtitle">
        Upload an Image or Video to Start Detecting Lanes!
    </div>

    <!-- Content Section -->
    <div class="content">
        <button class="btn">Upload Image</button>
        <button class="btn">Upload Video</button>
    </div>

</body>
</html>
